# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect repo in Dashboard → New → Blueprint, or set these values manually on the Web Service.

services:
  - type: web
    name: chatapp-mern-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/hello
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGINS
        value: https://sanjayyy04.github.io,http://localhost:5173,http://127.0.0.1:5173
